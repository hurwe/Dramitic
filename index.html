<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دراميتك - Dramatic | قصص AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --dark: #0a0a0a;
            --dark-2: #141414;
            --gray: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: #fff;
            overflow-x: hidden;
        }

        /* شاشة القفل */
       .lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

       .lock-box {
            text-align: center;
            padding: 40px;
            background: var(--dark-2);
            border-radius: 20px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
        }

       .lock-box img {
            width: 120px;
            margin-bottom: 20px;
        }

       .lock-box h1 {
            color: var(--gold);
            margin-bottom: 30px;
            font-size: 2rem;
        }

       .lock-box input {
            width: 300px;
            padding: 15px;
            font-size: 1.1rem;
            background: var(--gray);
            border: 2px solid var(--gold);
            color: #fff;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

       .lock-box button {
            width: 300px;
            padding: 15px;
            font-size: 1.1rem;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

       .lock-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--gold);
        }

        /* الهيدر */
        header {
            background: linear-gradient(180deg, #000 0%, transparent 100%);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

       .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

       .logo img {
            width: 50px;
            height: 50px;
        }

       .logo h1 {
            color: var(--gold);
            font-size: 1.8rem;
        }

       .admin-btn {
            padding: 10px 25px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

       .admin-btn:hover {
            transform: scale(1.05);
        }

        /* المحتوى */
       .main-content {
            margin-top: 100px;
            padding: 20px 5%;
            display: none;
        }

       .section-title {
            color: var(--gold);
            font-size: 1.8rem;
            margin: 30px 0 20px;
        }

       .stories-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

       .story-card {
            background: var(--dark-2);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }

       .story-card:hover {
            transform: scale(1.05);
            border-color: var(--gold);
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
        }

       .story-card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

       .story-info {
            padding: 15px;
        }

       .story-info h3 {
            color: var(--gold);
            margin-bottom: 5px;
        }

       .story-info p {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* المودال */
       .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            overflow-y: auto;
        }

       .modal-content {
            max-width: 1000px;
            margin: 50px auto;
            background: var(--dark-2);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--gold);
        }

       .modal-header {
            position: relative;
        }

       .modal-header video {
            width: 100%;
            max-height: 500px;
            background: #000;
        }

       .close-modal {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--gold);
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
        }

       .modal-body {
            padding: 30px;
        }

       .modal-body h2 {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 10px;
        }

       .director {
            color: #aaa;
            margin-bottom: 20px;
        }

       .story-text {
            line-height: 1.8;
            font-size: 1.1rem;
        }

        /* نافذة المتابعة */
       .follow-gate {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--dark-2);
            padding: 40px;
            border-radius: 20px;
            border: 3px solid var(--gold);
            z-index: 3000;
            text-align: center;
            display: none;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.5);
        }

       .follow-gate h2 {
            color: var(--gold);
            margin-bottom: 20px;
        }

       .follow-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

       .follow-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }

       .insta-btn {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #fff;
        }

       .tiktok-btn {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
        }

       .follow-btn:hover {
            transform: scale(1.1);
        }

       .follow-btn.clicked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* لوحة المخرج */
       .admin-panel {
            display: none;
            max-width: 800px;
            margin: 120px auto 50px;
            padding: 30px;
            background: var(--dark-2);
            border-radius: 20px;
            border: 2px solid var(--gold);
        }

       .admin-panel h2 {
            color: var(--gold);
            margin-bottom: 30px;
            text-align: center;
        }

       .form-group {
            margin-bottom: 20px;
        }

       .form-group label {
            display: block;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

       .form-group input,.form-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--gray);
            border: 1px solid var(--gold);
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
        }

       .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

       .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

       .submit-btn:hover {
            transform: scale(1.02);
        }

       .hidden { display: none!important; }
    </style>
</head>
<body>
    <!-- شاشة القفل -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-box">
            <img src="/mnt/data/photo7615521279995077580.jpeg" alt="Dramatic Logo">
            <h1>دراميتك - Dramatic</h1>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة السر">
            <button onclick="checkPassword()">دخول</button>
            <p id="errorMsg" style="color: #ff4444; margin-top: 15px; display: none;">كلمة السر خاطئة</p>
        </div>
    </div>

    <!-- نافذة المتابعة -->
    <div class="follow-gate" id="followGate">
        <h2>🔒 المحتوى مقفل</h2>
        <p>تابع حساباتنا على السوشيال ميديا لمشاهدة كل القصص مجاناً</p>
        <div class="follow-buttons">
            <button class="follow-btn insta-btn" id="instaBtn" onclick="followInsta()">📸 انستغرام</button>
            <button class="follow-btn tiktok-btn" id="tiktokBtn" onclick="followTiktok()">🎵 تيك توك</button>
        </div>
        <p style="margin-top: 20px; color: #aaa; font-size: 0.9rem;">المتابعة مرة واحدة فقط</p>
    </div>

    <!-- الهيدر -->
    <header>
        <div class="logo">
            <img src="/mnt/data/photo7615521279995077580.jpeg" alt="Logo">
            <h1>دراميتك</h1>
        </div>
        <button class="admin-btn" onclick="showAdminLogin()">لوحة المخرج</button>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="main-content" id="mainContent">
        <h2 class="section-title">🔥 أحدث القصص</h2>
        <div class="stories-row" id="storiesContainer"></div>
    </div>

    <!-- لوحة المخرج -->
    <div class="admin-panel" id="adminPanel">
        <h2>🎬 لوحة المخرج - إضافة قصة جديدة</h2>
        <div class="form-group">
            <label>عنوان القصة</label>
            <input type="text" id="storyTitle" placeholder="مثال: الملك الأخير">
        </div>
        <div class="form-group">
            <label>اسم المخرج</label>
            <input type="text" id="storyDirector" placeholder="اسمك">
        </div>
        <div class="form-group">
            <label>رابط صورة الغلاف</label>
            <input type="text" id="storyCover" placeholder="https://example.com/cover.jpg">
        </div>
        <div class="form-group">
            <label>رابط الفيديو</label>
            <input type="text" id="storyVideo" placeholder="https://example.com/video.mp4">
        </div>
        <div class="form-group">
            <label>نص القصة</label>
            <textarea id="storyText" placeholder="اكتب القصة كاملة هنا..."></textarea>
        </div>
        <button class="submit-btn" onclick="addStory()">➕ إضافة القصة</button>
        <button class="submit-btn" style="background: #666; margin-top: 10px;" onclick="backToHome()">رجوع للرئيسية</button>
    </div>

    <!-- مودال عرض القصة -->
    <div class="modal" id="storyModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="close-modal" onclick="closeModal()">×</button>
                <video id="modalVideo" controls></video>
            </div>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <p class="director" id="modalDirector"></p>
                <div class="story-text" id="modalText"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== الإعدادات - غيرها هنا =====
        const SITE_PASSWORD = "dramatic2026"; // كلمة سر الموقع
        const ADMIN_PASSWORD = "admin123"; // كلمة سر لوحة المخرج
        let followedInsta = false;
        let followedTiktok = false;

        // روابط حساباتك - غيرها
        const INSTAGRAM_LINK = "https://instagram.com/your_account";
        const TIKTOK_LINK = "https://tiktok.com/@your_account";

        // ===== البيانات =====
        let stories = JSON.parse(localStorage.getItem('dramatic_stories')) || [
            {
                title: "الملك الأخير",
                director: "أنت",
                cover: "https://picsum.photos/seed/king/400/600",
                video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                text: "في مملكة بعيدة، وقف الملك الأخير على أطلال قصره المحترق. كان يعلم أن هذه هي نهايته، لكنه رفض الاستسلام. قصة عن الشجاعة والتضحية في وجه المستحيل..."
            },
            {
                title: "حلم المدينة",
                director: "أنت",
                cover: "https://picsum.photos/seed/city/400/600",
                video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
                text: "مدينة نيون لا تنام أبداً. في شوارعها المظلمة، يبحث شاب عن حلمه الضائع وسط الأضواء والظلال. قصة سايبربانك عن الأمل في عالم مظلم..."
            },
            {
                title: "صرخة الصمت",
                director: "أنت",
                cover: "https://picsum.photos/seed/scream/400/600",
                video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                text: "عندما يصبح الصمت أعلى من الصراخ، تبدأ الحقيقة في الظهور. دراما نفسية عن الخوف والعزلة والبحث عن الذات في عالم صاخب..."
            }
        ];

        // ===== دوال النظام =====
        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === SITE_PASSWORD) {
                localStorage.setItem('dramatic_auth', 'true');
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('mainContent').style.display = 'block';
                loadStories();
                checkFollowStatus();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function checkFollowStatus() {
            const followed = localStorage.getItem('dramatic_followed');
            if (!followed) {
                document.getElementById('followGate').style.display = 'block';
            }
        }

        function followInsta() {
            window.open(INSTAGRAM_LINK, '_blank');
            followedInsta = true;
            document.getElementById('instaBtn').classList.add('clicked');
            document.getElementById('instaBtn').textContent = '✓ تم';
            checkBothFollowed();
        }

        function followTiktok() {
            window.open(TIKTOK_LINK, '_blank');
            followedTiktok = true;
            document.getElementById('tiktokBtn').classList.add('clicked');
            document.getElementById('tiktokBtn').textContent = '✓ تم';
            checkBothFollowed();
        }

        function checkBothFollowed() {
            if (followedInsta && followedTiktok) {
                localStorage.setItem('dramatic_followed', 'true');
                setTimeout(() => {
                    document.getElementById('followGate').style.display = 'none';
                }, 1000);
            }
        }

        function loadStories() {
            const container = document.getElementById('storiesContainer');
            container.innerHTML = '';
            stories.forEach((story, index) => {
                const card = document.createElement('div');
                card.className = 'story-card';
                card.innerHTML = `
                    <img src="${story.cover}" alt="${story.title}">
                    <div class="story-info">
                        <h3>${story.title}</h3>
                        <p>إخراج: ${story.director}</p>
                    </div>
                `;
                card.onclick = () => openStory(index);
                container.appendChild(card);
            });
        }

        function openStory(index) {
            const followed = localStorage.getItem('dramatic_followed');
            if (!followed) {
                document.getElementById('followGate').style.display = 'block';
                return;
            }

            const story = stories[index];
            document.getElementById('modalVideo').src = story.video;
            document.getElementById('modalTitle').textContent = story.title;
            document.getElementById('modalDirector').textContent = 'إخراج: ' + story.director;
            document.getElementById('modalText').textContent = story.text;
            document.getElementById('storyModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('storyModal').style.display = 'none';
            document.getElementById('modalVideo').pause();
        }

        function showAdminLogin() {
            const pass = prompt('أدخل كلمة سر لوحة المخرج:');
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else if (pass!== null) {
                alert('كلمة السر خاطئة');
            }
        }

        function addStory() {
            const title = document.getElementById('storyTitle').value;
            const director = document.getElementById('storyDirector').value;
            const cover = document.getElementById('storyCover').value;
            const video = document.getElementById('storyVideo').value;
            const text = document.getElementById('storyText').value;

            if (!title ||!director ||!cover ||!video ||!text) {
                alert('املأ كل الحقول');
                return;
            }

            stories.push({ title, director, cover, video, text });
            localStorage.setItem('dramatic_stories', JSON.stringify(stories));

            alert('تمت إضافة القصة بنجاح! 🎉');
            document.getElementById('storyTitle').value = '';
            document.getElementById('storyDirector').value = '';
            document.getElementById('storyCover').value = '';
            document.getElementById('storyVideo').value = '';
            document.getElementById('storyText').value = '';

            backToHome();
            loadStories();
        }

        function backToHome() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        // تشغيل تلقائي
        window.onload = function() {
            if (localStorage.getItem('dramatic_auth') === 'true') {
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('mainContent').style.display = 'block';
                loadStories();
                checkFollowStatus();
            }
        }

        // إغلاق المودال بالضغط خارجه
        document.getElementById('storyModal').onclick = function(e) {
            if (e.target === this) closeModal();
        }
    </script>
</body>
</html>
